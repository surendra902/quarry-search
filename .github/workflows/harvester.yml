name: 24/7 Cloud Harvester & Telegram Alerts

on:
  schedule:
    # Run every 20 minutes automatically on GitHub cloud servers (24/7/365)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  harvest:
    name: Harvest & Alert
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvester Cycle
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_harvester.py --oneshot --export-snapshot data/snapshot.json

      - name: Commit & Push Updated Snapshot
        run: |
          git config --global user.name "Quarry Cloud Harvester"
          git config --global user.email "bot@quarry-search.local"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No new links discovered. Snapshot unchanged."
          else
            git commit -m "chore(data): auto-update snapshot with newly harvested referral links [skip ci]"
            git push
            echo "New links committed and pushed to master. Vercel deployment triggered."
          fi
