name: Scheduled Free-Web Harvester & Telegram Alerts

on:
  schedule:
    # Best-effort scheduled runs, not an always-running service or uptime SLA.
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarry-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-scraping.txt
      - name: Install dependencies
        run: pip install -r requirements-scraping.txt
      - name: Harvest permitted free sources
        env:
          QUARRY_ENABLE_PAID_SOURCES: '0'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run_harvester.py --dry-run --db quarry.db --interval 1200 --export-snapshot data/snapshot.json
          else
            python run_harvester.py --oneshot --interval 1200 --export-snapshot data/snapshot.json
          fi
      - name: Persist records, source rotation and measurement state
        run: |
          git config user.name "Quarry Cloud Harvester"
          git config user.email "bot@quarry-search.local"
          git add data/snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update observed records and collector checkpoint [skip ci]"
            git push
          fi
